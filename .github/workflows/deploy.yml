# Publishes dist/ to GitHub Pages.
#
# Requires Pages to be switched on once, under
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The workflow cannot do that itself: creating a Pages site needs repo-admin
# rights, which the built-in GITHUB_TOKEN does not have.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # No actions/configure-pages step: it exists to hand a framework the
      # site's base path, and vite.config.ts already builds with a relative
      # base, so the bundle works from any subpath.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
